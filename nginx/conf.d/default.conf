# ======================================================================
# Nginx reverse proxy cho Website Cong thuc nau an
#  - Image nginx-unprivileged: chay bang user "nginx" (khong phai root),
#    nen lang nghe cong 8080/8443 (compose map 80->8080, 443->8443)
#  - HTTPS bang chung chi tu ky, TLS1.2+, security headers, rate limit
# ======================================================================

# Log JSON -> stdout (Promtail/Loki doc va truy van bang LogQL "| json")
log_format json_combined escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_method":"$request_method",'
  '"uri":"$uri","request_uri":"$request_uri","status":$status,"bytes_sent":$body_bytes_sent,'
  '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
  '"http_referer":"$http_referer","user_agent":"$http_user_agent"}';

server_tokens off;                      # an phien ban Nginx
gzip on;
gzip_types text/css application/javascript application/json text/plain;

# Gioi han toc do / ket noi (chong brute-force & flood)
limit_req_zone  $binary_remote_addr zone=login_zone:10m   rate=5r/m;
limit_req_zone  $binary_remote_addr zone=general_zone:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

# ---------- HTTP (8080): chuyen huong sang HTTPS ----------
server {
    listen 8080;
    server_name _;
    access_log /dev/stdout json_combined;

    location = /nginx-health {          # dung cho healthcheck cua Docker
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS (8443): reverse proxy toi app Node.js ----------
server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    access_log /dev/stdout json_combined;
    error_log  /dev/stderr warn;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ----- Security headers -----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ----- Gioi han request -----
    client_max_body_size   1m;
    client_body_timeout    10s;
    client_header_timeout  10s;
    keepalive_timeout      15s;
    send_timeout           10s;
    limit_conn conn_zone   30;
    limit_req  zone=general_zone burst=40 nodelay;
    limit_req_status 429;

    # ----- Proxy chung -----
    # Resolver noi bo cua Docker: Nginx khong sap khi container "app" khoi dong lai
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream "app:3000";

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # /metrics chi danh cho Prometheus (mang noi bo) - chan truy cap tu Internet
    location = /metrics {
        return 404;
    }

    # Trang dang nhap admin: chong do mat khau (5 lan/phut/IP)
    location = /admin/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://$app_upstream;
    }

    location / {
        proxy_pass http://$app_upstream;
    }
}

# ---------- Trang thai Nginx cho nginx-prometheus-exporter (chi mang noi bo) ----------
server {
    listen 8081;
    server_name _;
    access_log off;

    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    location = /stub_status {
        stub_status;
    }
    location / {
        return 404;
    }
}
