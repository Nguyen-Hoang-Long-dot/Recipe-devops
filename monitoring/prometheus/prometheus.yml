global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # Metrics cua tung container (CPU, RAM, network, disk)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Metrics web server Nginx (ket noi, request) qua stub_status
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # Metrics database MySQL
  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  # Metrics ung dung Node.js (HTTP request, latency, heap, so cong thuc...)
  - job_name: app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:3000"]

  # Metrics cua he thong log
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: promtail
    static_configs:
      - targets: ["promtail:9080"]
