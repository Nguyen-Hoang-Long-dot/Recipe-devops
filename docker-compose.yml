# ======================================================================
# De tai 29 - Website Cong thuc Nau an
# Stack: Node.js + MySQL + phpMyAdmin + Nginx
#        + Prometheus + Grafana (cAdvisor, nginx-exporter, mysqld-exporter)
#        + Loki + Promtail (log tap trung)
# Chay:  cp .env.example .env  (hoac ./scripts/gen-env.sh)  ->  docker compose up -d --build
# ======================================================================
name: recipe-platform

# Cau hinh bao mat / van hanh dung chung cho moi service
x-base: &base
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true          # chan leo thang dac quyen
  logging:
    driver: json-file
    options:
      max-size: "10m"                 # tranh log lam day dia
      max-file: "3"

services:
  # ---------------------------------------------------------------- CSDL
  db:
    image: mysql:8.0.40
    container_name: recipe_db
    <<: *base
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
      - --local-infile=0              # hardening: cam LOAD DATA LOCAL
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Hay tao file .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-recipe_db}
      # Bien duoi day chi dung cho script khoi tao db/init/03-users.sh (tao user quyen toi thieu)
      APP_DB_USER: ${APP_DB_USER:-recipe_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Hay tao file .env}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD:?Hay tao file .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    cap_drop:
      - ALL
    cap_add:                          # chi giu nhung quyen entrypoint can (chown + ha quyen xuong user mysql)
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - backend

  # ---------------------------------------------------------- Cong cu quan ly DB
  phpmyadmin:
    image: phpmyadmin:5.2.1-apache
    container_name: recipe_phpmyadmin
    <<: *base
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 8M
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"           # chi mo tren may local, khong ra Internet
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
    mem_limit: 256m
    networks:
      - backend
      - admin

  # ---------------------------------------------------------------- Ung dung
  app:
    build: ./app
    image: recipe-app:1.0
    container_name: recipe_app
    <<: *base
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: 1
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-recipe_db}
      DB_USER: ${APP_DB_USER:-recipe_app}
      DB_PASSWORD: ${APP_DB_PASSWORD:?Hay tao file .env}
      SESSION_SECRET: ${SESSION_SECRET:?Hay tao file .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Hay tao file .env}
    depends_on:
      db:
        condition: service_healthy
    read_only: true                   # he thong file chi doc
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 200
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - monitoring

  # ---------------------------------------------- Sinh chung chi HTTPS tu ky (chay 1 lan)
  cert-init:
    image: alpine:3.20
    container_name: recipe_cert_init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /certs/server.crt ]; then
          apk add --no-cache openssl >/dev/null &&
          openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
            -keyout /certs/server.key -out /certs/server.crt \
            -subj "/C=VN/O=Recipe Platform/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" &&
          chown 101:101 /certs/server.key /certs/server.crt &&   # 101 = user nginx trong image unprivileged
          chmod 600 /certs/server.key && chmod 644 /certs/server.crt &&
          echo "Da tao chung chi tu ky."
        else
          echo "Chung chi da ton tai, bo qua."
        fi
    volumes:
      - certs:/certs
    networks:
      - frontend

  # ------------------------------------------------------------ Reverse proxy
  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: recipe_nginx
    <<: *base
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
      cert-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - frontend
      - backend
      - monitoring

  # ============================ GIAM SAT: Prometheus + Grafana ============================
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: recipe_prometheus
    <<: *base
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    cap_drop:
      - ALL
    mem_limit: 512m
    networks:
      - monitoring
      - admin

  grafana:
    image: grafana/grafana:11.3.1
    container_name: recipe_grafana
    <<: *base
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Hay tao file .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_COOKIE_SAMESITE: strict
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    cap_drop:
      - ALL
    mem_limit: 512m
    networks:
      - monitoring
      - admin

  cadvisor:                           # metrics CPU/RAM/network cua tung container
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: recipe_cadvisor
    <<: *base
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    privileged: true                  # ngoai le co chu y: cAdvisor can doc cgroup cua host
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 256m
    networks:
      - monitoring

  nginx-exporter:                     # metrics web server
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: recipe_nginx_exporter
    <<: *base
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    depends_on:
      - nginx
    cap_drop:
      - ALL
    mem_limit: 64m
    networks:
      - monitoring

  mysqld-exporter:                    # metrics database
    image: prom/mysqld-exporter:v0.16.0
    container_name: recipe_mysqld_exporter
    <<: *base
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_DB_PASSWORD:?Hay tao file .env}
    depends_on:
      db:
        condition: service_healthy
    cap_drop:
      - ALL
    mem_limit: 64m
    networks:
      - backend                       # toi MySQL
      - monitoring                    # de Prometheus scrape

  # ============================ LOG TAP TRUNG: Loki + Promtail ============================
  loki:
    image: grafana/loki:3.2.1
    container_name: recipe_loki
    <<: *base
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./logging/loki:/etc/loki:ro
      - loki_data:/loki
    cap_drop:
      - ALL
    mem_limit: 512m
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:3.2.1
    container_name: recipe_promtail
    <<: *base
    command:
      - -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./logging/promtail:/etc/promtail:ro
      - promtail_positions:/positions
      - /var/run/docker.sock:/var/run/docker.sock:ro   # doc log container qua Docker API (chi doc)
    depends_on:
      - loki
    mem_limit: 128m
    networks:
      - monitoring

volumes:
  db_data:
  certs:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:

networks:
  frontend:                           # mang cong khai: chi Nginx
    driver: bridge
  backend:                            # mang noi bo: app <-> db (KHONG ra Internet)
    driver: bridge
    internal: true
  admin:                              # chi de publish cong quan tri vao 127.0.0.1
    driver: bridge
  monitoring:                         # mang noi bo cho giam sat & log
    driver: bridge
    internal: true
